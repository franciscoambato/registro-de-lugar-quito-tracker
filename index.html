<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVALUACIÓN PEDAGÓGICA // REGISTRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Paleta Naturaleza Retro */
      --outer-bg: #0d1b1e;        /* Verde noche profundo */
      --frame-green: #1f4e38;     /* Verde bosque estructurado */
      --card-bg: #11221f;         /* Verde follaje oscuro */
      --accent-leaf: #2e8b57;     /* Verde esmeralda / hoja */
      --accent-moss: #556b2f;     /* Verde musgo */
      --neon-lime: #76ff03;       /* Verde neón brillante para bordes/resaltados */
      --text-gold: #e6c280;       /* Tierra/Dorado cálido */
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: var(--outer-bg);
      color: #ffffff;
      max-width: 650px;
      margin: 20px auto;
      padding: 15px;
      line-height: 1.6;
    }

    .app-container {
      background-color: var(--frame-green);
      border: 4px solid var(--neon-lime);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(118, 255, 3, 0.3);
    }

    .form-card {
      position: relative;
      background: var(--card-bg);
      padding: 25px;
      border: 3px solid var(--accent-moss);
      border-radius: 6px;
      box-shadow: inset 0 0 10px #000;
      overflow: hidden;
    }

    /* Scanlines CRT en tono verdoso */
    .form-card::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 24, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
    }

    h2 {
      color: var(--text-gold);
      text-align: center;
      font-size: 13px;
      text-shadow: 2px 2px var(--outer-bg);
      margin-bottom: 25px;
      border-bottom: 3px dashed var(--accent-leaf);
      padding-bottom: 12px;
      position: relative;
      z-index: 3;
    }

    .field-block, .question-block {
      border-bottom: 1px dashed var(--accent-moss);
      padding-bottom: 15px;
      margin-top: 15px;
      position: relative;
      z-index: 3;
    }

    label {
      font-size: 9px;
      color: var(--neon-lime);
      display: block;
      margin-top: 10px;
      text-transform: uppercase;
      line-height: 1.4;
    }

    input, select {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      box-sizing: border-box;
      background-color: #08100e;
      color: #fff;
      border: 2px solid var(--accent-leaf);
      border-radius: 4px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--neon-lime);
      background-color: #0d1a17;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 15px;
      background: linear-gradient(90deg, var(--accent-moss) 0%, var(--accent-leaf) 100%);
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      font-weight: bold;
      border: 2px solid var(--neon-lime);
      border-radius: 4px;
      box-shadow: 3px 3px 0px #000;
      cursor: pointer;
      position: relative;
      z-index: 3;
    }

    button:hover {
      filter: brightness(1.2);
    }

    #statusMessage {
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      font-size: 11px;
      color: var(--text-gold);
      border: 2px dashed var(--neon-lime);
      background-color: #08100e;
      position: relative;
      z-index: 3;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="form-card">
      <h2>[ REGISTRO ]<br>EVALUACIÓN PEDAGÓGICA</h2>

      <form id="trackerForm">
        
        <!-- Datos personales -->
        <div class="field-block">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" placeholder="ej. Juan Pérez" required>
        </div>

        <div class="field-block">
          <label for="edad">Edad:</label>
          <input type="number" id="edad" placeholder="ej. 18" min="1" max="120" required>
        </div>

        <!-- Preguntas cerradas -->
        <div class="question-block">
          <label for="p1">1. ¿Consideras que el ritmo de la clase es adecuado?</label>
          <select id="p1" required>
            <option value="" disabled selected>SELECCIONAR...</option>
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
        </div>

        <div class="question-block">
          <label for="p2">2. ¿Los materiales visuales y recursos facilitan tu aprendizaje?</label>
          <select id="p2" required>
            <option value="" disabled selected>SELECCIONAR...</option>
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
        </div>

        <div class="question-block">
          <label for="p3">3. ¿Sientes que puedes resolver tus dudas durante la sesión?</label>
          <select id="p3" required>
            <option value="" disabled selected>SELECCIONAR...</option>
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
        </div>

        <div class="question-block">
          <label for="p4">4. ¿Las actividades prácticas ayudan a fijar el conocimiento?</label>
          <select id="p4" required>
            <option value="" disabled selected>SELECCIONAR...</option>
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
        </div>

        <div class="question-block">
          <label for="p5">5. ¿Recomendarías este contenido a otros estudiantes?</label>
          <select id="p5" required>
            <option value="" disabled selected>SELECCIONAR...</option>
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
        </div>

        <button type="submit" id="submitBtn">> GUARDAR EVALUACIÓN</button>
      </form>

      <div id="statusMessage" class="hidden"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYlDwmiQ406l3_FsUqZeOtP2B5EgdwchCeBvKSZyBOKx9Wm2i_4INY9OqcnXOem8sc/exec";

    document.getElementById('trackerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMessage');
      
      btn.disabled = true;
      btn.innerText = "ENVIANDO...";

      const evaluacionData = {
        nombre: document.getElementById('nombre').value,
        edad: document.getElementById('edad').value,
        p1: document.getElementById('p1').value,
        p2: document.getElementById('p2').value,
        p3: document.getElementById('p3').value,
        p4: document.getElementById('p4').value,
        p5: document.getElementById('p5').value
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(evaluacionData)
        });

        status.innerText = "Evaluación enviada con éxito";
        status.classList.remove('hidden');
        document.getElementById('trackerForm').reset();
      } catch (error) {
        status.innerText = "Error de conexión.";
        status.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = "> GUARDAR EVALUACIÓN";
      }
    });
  </script>

</body>
</html>
