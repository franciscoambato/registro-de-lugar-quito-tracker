<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUITO TRACKER // REGISTRO NATURALEZA</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Paleta Naturaleza Retro */
      --outer-bg: #0d1b1e;        /* Verde noche profundo */
      --frame-green: #1f4e38;     /* Verde bosque estructurado */
      --card-bg: #11221f;         /* Verde follaje oscuro */
      --accent-leaf: #2e8b57;     /* Verde esmeralda / hoja */
      --accent-moss: #556b2f;     /* Verde musgo */
      --neon-lime: #76ff03;       /* Verde neón brillante para bordes/resaltados */
      --text-gold: #e6c280;       /* Tierra/Dorado cálido */
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: var(--outer-bg);
      color: #ffffff;
      max-width: 650px;
      margin: 20px auto;
      padding: 15px;
      line-height: 1.6;
    }

    .app-container {
      background-color: var(--frame-green);
      border: 4px solid var(--neon-lime);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(118, 255, 3, 0.3);
    }

    .form-card {
      position: relative;
      background: var(--card-bg);
      padding: 25px;
      border: 3px solid var(--accent-moss);
      border-radius: 6px;
      box-shadow: inset 0 0 10px #000;
      overflow: hidden;
    }

    /* Scanlines CRT en tono verdoso */
    .form-card::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 24, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
    }

    h2 {
      color: var(--text-gold);
      text-align: center;
      font-size: 13px;
      text-shadow: 2px 2px var(--outer-bg);
      margin-bottom: 25px;
      border-bottom: 3px dashed var(--accent-leaf);
      padding-bottom: 12px;
      position: relative;
      z-index: 3;
    }

    .question-block {
      border-bottom: 1px dashed var(--accent-moss);
      padding-bottom: 15px;
      margin-top: 15px;
      position: relative;
      z-index: 3;
    }

    label {
      font-size: 9px;
      color: var(--neon-lime);
      display: block;
      margin-top: 10px;
      text-transform: uppercase;
      line-height: 1.4;
    }

    select, textarea {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      box-sizing: border-box;
      background-color: #08100e;
      color: #fff;
      border: 2px solid var(--accent-leaf);
      border-radius: 4px;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: var(--neon-lime);
      background-color: #0d1a17;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 15px;
      background: linear-gradient(90deg, var(--accent-moss) 0%, var(--accent-leaf) 100%);
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      font-weight: bold;
      border: 2px solid var(--neon-lime);
      border-radius: 4px;
      box-shadow: 3px 3px 0px #000;
      cursor: pointer;
      position: relative;
      z-index: 3;
    }

    button:hover {
      filter: brightness(1.2);
    }

    #statusMessage {
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      font-size: 11px;
      color: var(--text-gold);
      border: 2px dashed var(--neon-lime);
      background-color: #08100e;
      position: relative;
      z-index: 3;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="form-card">
      <h2>[ QUITO TRACKER ]<br>EVALUACIÓN ECOLÓGICA / LUGAR</h2>

      <form id="trackerForm">
        
        <!-- Pregunta 1 -->
        <div class="question-block">
          <label for="p1_respuesta">1. ¿El lugar cuenta con áreas verdes o espacios al aire libre?</label>
          <select id="p1_respuesta" required>
            <option value="" disabled selected>SELECCIONAR...</option>
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
          <textarea id="p1_porque" rows="2" placeholder="¿Por qué? (Opcional)"></textarea>
        </div>

        <!-- Pregunta 2 -->
        <div class="question-block">
          <label for="p2_respuesta">2. ¿Tiene acceso de transporte sostenible (bici, caminable)?</label>
          <select id="p2_respuesta" required>
            <option value="" disabled selected>SELECCIONAR...</option>
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
          <textarea id="p2_porque" rows="2" placeholder="¿Por qué? (Opcional)"></textarea>
        </div>

        <!-- Pregunta 3 -->
        <div class="question-block">
          <label for="p3_respuesta">3. ¿Es un espacio tranquilo y libre de contaminación auditiva?</label>
          <select id="p3_respuesta" required>
            <option value="" disabled selected>SELECCIONAR...</option>
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
          <textarea id="p3_porque" rows="2" placeholder="¿Por qué? (Opcional)"></textarea>
        </div>

        <!-- Pregunta 4 -->
        <div class="question-block">
          <label for="p4_respuesta">4. ¿Ofrece opciones económicas o de bajo costo (hasta $15 USD)?</label>
          <select id="p4_respuesta" required>
            <option value="" disabled selected>SELECCIONAR...</option>
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
          <textarea id="p4_porque" rows="2" placeholder="¿Por qué? (Opcional)"></textarea>
        </div>

        <!-- Pregunta 5 -->
        <div class="question-block">
          <label for="p5_respuesta">5. ¿Lo recomendarías para visitar en grupo o pareja?</label>
          <select id="p5_respuesta" required>
            <option value="" disabled selected>SELECCIONAR...</option>
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
          <textarea id="p5_porque" rows="2" placeholder="¿Por qué? (Opcional)"></textarea>
        </div>

        <button type="submit" id="submitBtn">> GUARDAR EVALUACIÓN</button>
      </form>

      <div id="statusMessage" class="hidden"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYlDwmiQ406l3_FsUqZeOtP2B5EgdwchCeBvKSZyBOKx9Wm2i_4INY9OqcnXOem8sc/exec";

    document.getElementById('trackerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMessage');
      
      btn.disabled = true;
      btn.innerText = "ENVIANDO...";

      const lugarData = {
        p1_respuesta: document.getElementById('p1_respuesta').value,
        p1_porque: document.getElementById('p1_porque').value,
        p2_respuesta: document.getElementById('p2_respuesta').value,
        p2_porque: document.getElementById('p2_porque').value,
        p3_respuesta: document.getElementById('p3_respuesta').value,
        p3_porque: document.getElementById('p3_porque').value,
        p4_respuesta: document.getElementById('p4_respuesta').value,
        p4_porque: document.getElementById('p4_porque').value,
        p5_respuesta: document.getElementById('p5_respuesta').value,
        p5_porque: document.getElementById('p5_porque').value
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(lugarData)
        });

        status.innerText = "Formulario enviado con éxito";
        status.classList.remove('hidden');
        document.getElementById('trackerForm').reset();
      } catch (error) {
        status.innerText = "Error de conexión.";
        status.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = "> GUARDAR EVALUACIÓN";
      }
    });
  </script>

</body>
</html>
