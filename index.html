<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVALUACIÓN PEDAGÓGICA // ESTUDIO DE MERCADO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Paleta Marca Natural Profesional */
      --bg-gradient-start: #f4f7f4;
      --bg-gradient-end: #e2ebe2;
      --card-bg: #ffffff;
      --brand-primary: #2d5a27;      /* Verde bosque profesional */
      --brand-accent: #486b43;       /* Verde salvia */
      --brand-light: #f0f5ef;        /* Verde muy suave para fondos */
      --green-active: #22c55e;       /* Verde vibrante para selección activa */
      --text-main: #1f2937;          /* Gris oscuro lectura limpia */
      --text-muted: #6b7280;
      --border-color: #d1d5db;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 35px 30px;
      box-shadow: 0 10px 25px rgba(45, 90, 39, 0.08);
      border: 1px solid rgba(45, 90, 39, 0.1);
    }

    .header-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .header-title h2 {
      color: var(--brand-primary);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 13px;
    }

    .field-block, .question-block {
      margin-bottom: 22px;
    }

    label.field-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--brand-primary);
      display: block;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    input[type="text"], input[type="number"] {
      font-family: inherit;
      font-size: 14px;
      width: 100%;
      padding: 12px 16px;
      background-color: var(--brand-light);
      color: var(--text-main);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--brand-primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.12);
    }

    /* Opciones interactivas con indicador circular */
    .toggle-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toggle-option {
      flex: 1;
      min-width: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: #ffffff;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .toggle-option input[type="radio"] {
      display: none;
    }

    .toggle-option span.label-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .circle-indicator {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background-color: #ffffff;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    /* Estado seleccionado */
    .toggle-option input[type="radio"]:checked + .circle-indicator,
    .toggle-option.active .circle-indicator {
      border-color: var(--green-active);
      background-color: var(--green-active);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    .toggle-option.active {
      border-color: var(--green-active);
      background-color: var(--brand-light);
    }

    .toggle-option.active .label-text {
      color: var(--brand-primary);
    }

    /* Pregunta 4: Checkboxes estilo tarjetas */
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkbox-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .checkbox-card input[type="checkbox"] {
      display: none;
    }

    .checkbox-card span.label-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    .checkbox-card.active {
      border-color: var(--green-active);
      background-color: var(--brand-light);
    }

    .checkbox-card.active .circle-indicator {
      border-color: var(--green-active);
      background-color: var(--green-active);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    button.submit-btn {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      background-color: var(--brand-primary);
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(45, 90, 39, 0.2);
      transition: all 0.2s ease;
    }

    button.submit-btn:hover {
      background-color: var(--brand-accent);
      transform: translateY(-1px);
    }

    #statusMessage {
      margin-top: 18px;
      padding: 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-primary);
      border-radius: var(--radius-md);
      background-color: var(--brand-light);
      border: 1px solid var(--brand-accent);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-title">
      <h2>EVALUACIÓN PEDAGÓGICA</h2>
      <p>Estudio de preferencias e ingredientes naturales</p>
    </div>

    <form id="trackerForm">
      
      <!-- Datos personales -->
      <div class="field-block">
        <label class="field-title" for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Ej. Ana Martínez" required>
      </div>

      <div class="field-block">
        <label class="field-title" for="edad">Edad</label>
        <input type="number" id="edad" placeholder="Ej. 24" min="1" max="120" required>
      </div>

      <!-- Pregunta 1 -->
      <div class="question-block">
        <label class="field-title">1. ¿Usted comparte un estilo de vida vegano?</label>
        <div class="toggle-group">
          <label class="toggle-option">
            <span class="label-text">SÍ</span>
            <input type="radio" name="p1" value="SI" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">NO</span>
            <input type="radio" name="p1" value="NO" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
        </div>
      </div>

      <!-- Pregunta 2 -->
      <div class="question-block">
        <label class="field-title">2. ¿Usted consume agua de sábila diariamente?</label>
        <div class="toggle-group">
          <label class="toggle-option">
            <span class="label-text">SÍ</span>
            <input type="radio" name="p2" value="SI" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">NO</span>
            <input type="radio" name="p2" value="NO" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
        </div>
      </div>

      <!-- Pregunta 3 -->
      <div class="question-block">
        <label class="field-title">3. ¿Usted prefiere el producto por la horchata o por la sábila?</label>
        <div class="toggle-group">
          <label class="toggle-option">
            <span class="label-text">HORCHATA</span>
            <input type="radio" name="p3" value="HORCHATA" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">SÁBILA</span>
            <input type="radio" name="p3" value="SÁBILA" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
        </div>
      </div>

      <!-- Pregunta 4 (Selección Múltiple) -->
      <div class="question-block">
        <label class="field-title">4. ¿Cuál de estos factores te resulta más atractivo del producto? (Selección múltiple)</label>
        <div class="checkbox-group">
          <label class="checkbox-card" onclick="toggleCheckbox(this)">
            <span class="label-text">1. Que sus ingredientes sean de origen natural</span>
            <input type="checkbox" name="p4_opcion" value="Ingredientes naturales">
            <div class="circle-indicator"></div>
          </label>
          <label class="checkbox-card" onclick="toggleCheckbox(this)">
            <span class="label-text">2. Comodidad al prepararlo y facilidad para transportarlo</span>
            <input type="checkbox" name="p4_opcion" value="Comodidad y transporte">
            <div class="circle-indicator"></div>
          </label>
          <label class="checkbox-card" onclick="toggleCheckbox(this)">
            <span class="label-text">3. Su aspecto higiénico y registro sanitario</span>
            <input type="checkbox" name="p4_opcion" value="Higiene y registro sanitario">
            <div class="circle-indicator"></div>
          </label>
          <label class="checkbox-card" onclick="toggleCheckbox(this)">
            <span class="label-text">4. El precio</span>
            <input type="checkbox" name="p4_opcion" value="Precio">
            <div class="circle-indicator"></div>
          </label>
          <label class="checkbox-card" onclick="toggleCheckbox(this)">
            <span class="label-text">5. Su sabor</span>
            <input type="checkbox" name="p4_opcion" value="Sabor">
            <div class="circle-indicator"></div>
          </label>
        </div>
      </div>

      <!-- Pregunta 5 (3 Opciones) -->
      <div class="question-block">
        <label class="field-title">5. ¿Le gustaría consumirlo frío o caliente?</label>
        <div class="toggle-group">
          <label class="toggle-option">
            <span class="label-text">FRÍO</span>
            <input type="radio" name="p5" value="FRIO" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">CALIENTE</span>
            <input type="radio" name="p5" value="CALIENTE" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">AMBOS</span>
            <input type="radio" name="p5" value="AMBOS" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Enviar Evaluación</button>
    </form>

    <div id="statusMessage" class="hidden"></div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYlDwmiQ406l3_FsUqZeOtP2B5EgdwchCeBvKSZyBOKx9Wm2i_4INY9OqcnXOem8sc/exec";

    function updateRadioState(input) {
      const groupName = input.name;
      const options = document.querySelectorAll(`input[name="${groupName}"]`);
      options.forEach(opt => {
        opt.closest('.toggle-option').classList.remove('active');
      });
      input.closest('.toggle-option').classList.add('active');
    }

    function toggleCheckbox(card) {
      const checkbox = card.querySelector('input[type="checkbox"]');
      setTimeout(() => {
        if (checkbox.checked) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      }, 10);
    }

    document.getElementById('trackerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMessage');

      const p4Checkboxes = document.querySelectorAll('input[name="p4_opcion"]:checked');
      if (p4Checkboxes.length === 0) {
        alert("Por favor selecciona al menos una opción en la pregunta 4.");
        return;
      }

      const p4Respuestas = Array.from(p4Checkboxes).map(cb => cb.value).join(', ');

      btn.disabled = true;
      btn.innerText = "Enviando respuestas...";

      const evaluacionData = {
        nombre: document.getElementById('nombre').value,
        edad: document.getElementById('edad').value,
        p1: document.querySelector('input[name="p1"]:checked').value,
        p2: document.querySelector('input[name="p2"]:checked').value,
        p3: document.querySelector('input[name="p3"]:checked').value,
        p4: p4Respuestas,
        p5: document.querySelector('input[name="p5"]:checked').value
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(evaluacionData)
        });

        status.innerText = "¡Muchas gracias! Evaluación enviada con éxito.";
        status.classList.remove('hidden');
        document.getElementById('trackerForm').reset();
        document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
      } catch (error) {
        status.innerText = "Ocurrió un error al enviar. Por favor intenta de nuevo.";
        status.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = "Enviar Evaluación";
      }
    });
  </script>

</body>
</html>
