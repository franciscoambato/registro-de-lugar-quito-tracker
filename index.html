<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVALUACIÓN PEDAGÓGICA // ESTUDIO DE MERCADO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #f4f7f4;
      --bg-gradient-end: #e2ebe2;
      --card-bg: #ffffff;
      --brand-primary: #2d5a27;
      --brand-accent: #486b43;
      --brand-light: #f0f5ef;
      --green-active: #22c55e;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #d1d5db;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 35px 30px;
      box-shadow: 0 10px 25px rgba(45, 90, 39, 0.08);
      border: 1px solid rgba(45, 90, 39, 0.1);
    }

    .header-title { text-align: center; margin-bottom: 30px; }
    .header-title h2 { color: var(--brand-primary); font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .header-title p { color: var(--text-muted); font-size: 13px; }

    .field-block, .question-block { margin-bottom: 22px; }
    label.field-title { font-size: 13.5px; font-weight: 600; color: var(--brand-primary); display: block; margin-bottom: 10px; }

    input[type="text"], input[type="number"] {
      font-family: inherit; font-size: 14px; width: 100%; padding: 12px 16px;
      background-color: var(--brand-light); color: var(--text-main);
      border: 1.5px solid var(--border-color); border-radius: var(--radius-md); outline: none;
    }

    .toggle-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .toggle-option {
      flex: 1; min-width: 100px; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border: 1.5px solid var(--border-color); border-radius: var(--radius-md);
      background-color: #ffffff; cursor: pointer; user-select: none;
    }
    .toggle-option input[type="radio"] { display: none; }
    .toggle-option span.label-text { font-size: 13px; font-weight: 600; }
    .circle-indicator { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-color); }

    .toggle-option.active { border-color: var(--green-active); background-color: var(--brand-light); }
    .toggle-option.active .circle-indicator { border-color: var(--green-active); background-color: var(--green-active); }

    .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
    .checkbox-card {
      display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
      border: 1.5px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer;
    }
    .checkbox-card input[type="checkbox"] { display: none; }
    .checkbox-card span.label-text { font-size: 13px; font-weight: 500; }
    .checkbox-card.active { border-color: var(--green-active); background-color: var(--brand-light); }
    .checkbox-card.active .circle-indicator { border-color: var(--green-active); background-color: var(--green-active); }

    button.submit-btn {
      width: 100%; padding: 15px; margin-top: 15px; background-color: var(--brand-primary);
      color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600;
      border: none; border-radius: var(--radius-md); cursor: pointer;
    }

    #statusMessage {
      margin-top: 18px; padding: 14px; text-align: center; font-size: 13px; font-weight: 600;
      color: var(--brand-primary); border-radius: var(--radius-md); background-color: var(--brand-light);
      border: 1px solid var(--brand-accent);
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-title">
      <h2>Encuesta</h2>
      <p>Estudio de preferencias e ingredientes naturales</p>
    </div>

    <!-- Iframe oculto para evitar redirecciones o problemas con CORS -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { showSuccessMessage(); }"></iframe>

    <form id="trackerForm" target="hidden_iframe" method="POST">
      
      <div class="field-block">
        <label class="field-title" for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Martínez" required>
      </div>

      <div class="field-block">
        <label class="field-title" for="edad">Edad</label>
        <input type="number" id="edad" name="edad" placeholder="Ej. 24" min="1" max="120" required>
      </div>

      <!-- Pregunta 1 -->
      <div class="question-block">
        <label class="field-title">1. ¿Usted comparte un estilo de vida vegano?</label>
        <div class="toggle-group">
          <label class="toggle-option">
            <span class="label-text">SÍ</span>
            <input type="radio" name="p1" value="SI" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">NO</span>
            <input type="radio" name="p1" value="NO" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
        </div>
      </div>

      <!-- Pregunta 2 -->
      <div class="question-block">
        <label class="field-title">2. ¿Usted consume agua de sábila diariamente?</label>
        <div class="toggle-group">
          <label class="toggle-option">
            <span class="label-text">SÍ</span>
            <input type="radio" name="p2" value="SI" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">NO</span>
            <input type="radio" name="p2" value="NO" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
        </div>
      </div>

      <!-- Pregunta 3 -->
      <div class="question-block">
        <label class="field-title">3. ¿Usted prefiere el producto por la horchata o por la sábila?</label>
        <div class="toggle-group">
          <label class="toggle-option">
            <span class="label-text">HORCHATA</span>
            <input type="radio" name="p3" value="HORCHATA" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">SÁBILA</span>
            <input type="radio" name="p3" value="SÁBILA" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">AMBOS</span>
            <input type="radio" name="p3" value="AMBOS" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
        </div>
      </div>

      <!-- Pregunta 4 -->
      <div class="question-block">
        <label class="field-title">4. ¿Cuál de estos factores te resulta más atractivo del producto? (Selección múltiple)</label>
        <div class="checkbox-group">
          <label class="checkbox-card" onclick="toggleCheckbox(this)">
            <span class="label-text">1. Que sus ingredientes sean de origen natural</span>
            <input type="checkbox" name="p4_opcion" value="Ingredientes naturales">
            <div class="circle-indicator"></div>
          </label>
          <label class="checkbox-card" onclick="toggleCheckbox(this)">
            <span class="label-text">2. Comodidad al prepararlo y facilidad para transportarlo</span>
            <input type="checkbox" name="p4_opcion" value="Comodidad y transporte">
            <div class="circle-indicator"></div>
          </label>
          <label class="checkbox-card" onclick="toggleCheckbox(this)">
            <span class="label-text">3. Su aspecto higiénico y registro sanitario</span>
            <input type="checkbox" name="p4_opcion" value="Higiene y registro sanitario">
            <div class="circle-indicator"></div>
          </label>
          <label class="checkbox-card" onclick="toggleCheckbox(this)">
            <span class="label-text">4. El precio</span>
            <input type="checkbox" name="p4_opcion" value="Precio">
            <div class="circle-indicator"></div>
          </label>
          <label class="checkbox-card" onclick="toggleCheckbox(this)">
            <span class="label-text">5. Su sabor</span>
            <input type="checkbox" name="p4_opcion" value="Sabor">
            <div class="circle-indicator"></div>
          </label>
        </div>
      </div>

      <!-- Campo oculto donde se concatenan las selecciones de la pregunta 4 -->
      <input type="hidden" name="p4" id="p4_hidden">

      <!-- Pregunta 5 -->
      <div class="question-block">
        <label class="field-title">5. ¿Le gustaría consumirlo frío o caliente?</label>
        <div class="toggle-group">
          <label class="toggle-option">
            <span class="label-text">FRÍO</span>
            <input type="radio" name="p5" value="FRIO" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">CALIENTE</span>
            <input type="radio" name="p5" value="CALIENTE" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
          <label class="toggle-option">
            <span class="label-text">AMBOS</span>
            <input type="radio" name="p5" value="AMBOS" required onclick="updateRadioState(this)">
            <div class="circle-indicator"></div>
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Enviar Evaluación</button>
    </form>

    <div id="statusMessage" class="hidden"></div>
  </div>

  <script>
    // URL de la App Web configurada
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUjGxCsa7fSkSGfcT6K5yTzd5qtJsbBUMzvyXAyG4RGHaQpvQ0whrBC-7GUmYxh2Q_/exec";

    let submitted = false;
    const form = document.getElementById('trackerForm');
    form.action = GOOGLE_SCRIPT_URL;

    function updateRadioState(input) {
      const groupName = input.name;
      const options = document.querySelectorAll(`input[name="${groupName}"]`);
      options.forEach(opt => {
        opt.closest('.toggle-option').classList.remove('active');
      });
      input.closest('.toggle-option').classList.add('active');
    }

    function toggleCheckbox(card) {
      const checkbox = card.querySelector('input[type="checkbox"]');
      setTimeout(() => {
        if (checkbox.checked) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      }, 10);
    }

    form.addEventListener('submit', function(e) {
      const p4Checkboxes = document.querySelectorAll('input[name="p4_opcion"]:checked');
      if (p4Checkboxes.length === 0) {
        e.preventDefault();
        alert("Por favor selecciona al menos una opción en la pregunta 4.");
        return;
      }

      // Concatena las respuestas seleccionadas en el campo p4
      const p4Valores = Array.from(p4Checkboxes).map(cb => cb.value).join(', ');
      document.getElementById('p4_hidden').value = p4Valores;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Enviando respuestas...";
      submitted = true;
    });

    function showSuccessMessage() {
      const status = document.getElementById('statusMessage');
      const btn = document.getElementById('submitBtn');
      status.innerText = "¡Muchas gracias! Evaluación enviada con éxito.";
      status.classList.remove('hidden');
      form.reset();
      document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
      btn.disabled = false;
      btn.innerText = "Enviar Evaluación";
      submitted = false;
    }
  </script>

</body>
</html>
